name = "realitydb-lab-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
# Keep the *.workers.dev URL alive alongside the custom domain: the
# published @realitydb/mcp-server v1.0.0 and the pricing page still
# default to realitydb-lab-api.eddy-078.workers.dev. Adding the custom
# domain otherwise disables workers.dev by default and 404s them.
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "realitydb-labs"
database_id = "1fa51a0c-c851-4cec-8e91-ac1ee2079ff8"

[[r2_buckets]]
binding = "TEMPLATES"
bucket_name = "realitydb-templates"

# Short-lived cache for the R2-probed pack catalog (GET /v1/agent/packs).
# Entries expire after 5 minutes; POST /v1/agent/packs/refresh clears them
# on demand right after a pack is uploaded to R2.
[[kv_namespaces]]
binding = "KV"
id = "5ca9d6e543a249f482e36c7a3877ca07"

[vars]
ENVIRONMENT = "production"

[triggers]
crons = ["0 * * * *"]

[[routes]]
pattern = "lab.realitydb.dev"
custom_domain = true
